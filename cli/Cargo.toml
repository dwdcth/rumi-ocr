[package]
name = "rumi-cli"
version = "0.1.0"
edition = "2024"

# bin 名保持 rumi-capture（对外用法不变），crate 本体是"组合 package"：
# 只链 lib，不产 lib target。存在意义（K1）：capture↔ocr 互相需要对方
# （capture 出 Frame、ocr 封装引擎），包循环依赖被 cargo 禁止；把同时
# 需要两者的 CLI 抽到独立 crate，即可让 ocr 子命令进程内直调引擎。
[[bin]]
name = "rumi-capture"
path = "src/rumi_capture.rs"

[dependencies]
rumi-capture = { path = "../capture" }
rumi-ocr = { path = "../ocr" }
# `ocr --copy`：识别文本进剪贴板。Wayland 数据源要求进程存活一小段，
# 拷完 park 300ms 再退。
arboard = { version = "3", features = ["wayland-data-control"] }
# 其余四个子命令（info/full/region/window）的 async 驱动
futures = "0.3"
# full/region/window 落盘 PNG
image = { version = "0.25", default-features = false, features = ["png"] }
# RUMI_FORCE_PORTAL 调试开关：手工构造 Capturer::Portal（规格须与
# capture crate 的 zbus 一致，保证连接类型互通）
zbus = { version = "5", default-features = false, features = ["async-io"] }
