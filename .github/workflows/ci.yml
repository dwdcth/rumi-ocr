# rumi CI：push(main)/PR 时 Linux 单 job 编译 + 全量测试。
# 结构参考 docforge 的 ci.yml；Linux 系统依赖清单来自 Dioxus 官方
# （dx doctor 与 DioxusLabs/dioxus 主仓库 .github/workflows/main.yml 的
# 桌面清单：webkit2gtk 4.1 / alsa / appindicator 等，另加 rumi 自己
# 链的 libxdo——enigo 截图核心需要）。注：DioxusLabs/dioxus-ci 官方
# actions 仓库只有 web 构建链，无 desktop 依赖清单，勿引用。
#
# 环境两个硬前提（详见 release.yml 头注释）：
# 1. rumi-ui 是 wry/WebKitGTK 桌面应用，Linux 需 webkit2gtk 4.1 系统依赖；
# 2. ort-sys 走 pkg-config 动态链系统 onnxruntime（防双 protobuf 互劫持，
#    见 server/Cargo.toml ort-sys 注释）——探测失败会静默回退静态预编译
#    并重新引入第二份 protobuf，所以构建前显式断言 pkg-config 能找到。

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  ORT_VERSION: "1.22.1"

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install desktop system deps (webkit2gtk 4.1 etc.)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libasound2-dev \
            libudev-dev \
            libayatana-appindicator3-dev \
            libglib2.0-dev \
            libxdo-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev

      # onnxruntime 不在 Ubuntu 官方源里：从 NuGet 官方包（微软 GitHub 仓库
      # 2026-11-17 起整体 404，release 资产全灭，PyPI/NuGet 未受影响）解出
      # linux-x64 native 库 + 手写 .pc，让 ort-sys 的 pkg-config 探测命中
      # 动态库。SONAME=libonnxruntime.so.1，运行期 loader 按此名找。
      - name: Prepare onnxruntime (pkg-config, dynamic link)
        run: |
          set -euxo pipefail
          curl -sSL -o /tmp/ort.nupkg \
            "https://www.nuget.org/api/v2/package/Microsoft.ML.OnnxRuntime/${ORT_VERSION}"
          mkdir -p /tmp/ortx && cd /tmp/ortx
          unzip -q /tmp/ort.nupkg 'runtimes/linux-x64/native/*' 'build/native/include/*'
          sudo mkdir -p /opt/onnxruntime/lib /opt/onnxruntime/include
          sudo cp runtimes/linux-x64/native/libonnxruntime.so /opt/onnxruntime/lib/
          sudo ln -sf libonnxruntime.so /opt/onnxruntime/lib/libonnxruntime.so.1
          sudo cp -r build/native/include/. /opt/onnxruntime/include/
          sudo mkdir -p /opt/onnxruntime/lib/pkgconfig
          sudo tee /opt/onnxruntime/lib/pkgconfig/libonnxruntime.pc >/dev/null <<EOF
          prefix=/opt/onnxruntime
          libdir=\${prefix}/lib
          includedir=\${prefix}/include

          Name: onnxruntime
          Description: ONNX Runtime (dynamic link)
          Version: ${ORT_VERSION}
          Libs: -L\${libdir} -lonnxruntime
          Cflags: -I\${includedir}
          EOF
          echo "PKG_CONFIG_PATH=/opt/onnxruntime/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          # 运行期：测试进程加载 libonnxruntime.so（链接期走 .pc，加载期
          # loader 不认 pkg-config），/opt 非默认搜索路径必须显式给。
          echo "LD_LIBRARY_PATH=/opt/onnxruntime/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      # 断言：探测不到直接红，不给 ort-sys 静默回退静态库的机会。
      - name: Verify onnxruntime discoverable via pkg-config
        run: pkg-config --modversion libonnxruntime

      # protobuf link_guard（translate/tests/link_guard.rs）扫的是
      # target/debug 下的 rumi-ui / rumi-server，先构建这两个 bin。
      # CXXFLAGS=-march=x86-64：CTranslate2 基础 kernels.cc 必须编出
      # GENERIC 实例——CI 曾出现该 TU 被编出 __AVX2__（rust-lld:
      # "did you mean (CpuIsa)2"），GENERIC/AVX 实例缺失链接失败；
      # 显式钉基线覆盖任何来源的 ISA 泄漏（kernels_avx*.cc 的 -mavx*
      # 是 per-source flags 追加在后，不受影响）。
      - name: Build bins (link_guard coverage)
        run: cargo build -p rumi-ui -p rumi-server
        env:
          CXXFLAGS: -march=x86-64

      - name: Test (workspace)
        run: cargo test --workspace
        env:
          CXXFLAGS: -march=x86-64

      # 失败取证：CTranslate2 的全局 CXX flags 与 kernels 实例分布
      # （kernels.cc 应为 CpuIsa)0，avx 副本为 CpuIsa)1，以此定位
      # ISA 泄漏是否复发及来源）。
      - name: Diagnose ct2rs cmake flags (on failure)
        if: failure()
        run: |
          set -x
          find target -path '*ct2rs*/out/build/CMakeCache.txt' \
            -exec grep -H "CMAKE_CXX_FLAGS" {} \; | head -20
          find target -path '*ct2rs*/out*' -name 'libctranslate2.a' | head -1 \
            | xargs -r nm -C 2>/dev/null \
            | grep "reduce_amax<(ctranslate2::cpu::CpuIsa)" \
            | grep -oE "CpuIsa\)[0-9]+, float" | sort | uniq -c
