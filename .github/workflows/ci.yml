# rumi CI：push(main)/PR 时 Linux 单 job 编译 + 全量测试。
# 结构参考 docforge 的 ci.yml；Linux 系统依赖清单来自 Dioxus 官方
# （dx doctor 与 DioxusLabs/dioxus 主仓库 .github/workflows/main.yml 的
# 桌面清单：webkit2gtk 4.1 / alsa / appindicator 等，另加 rumi 自己
# 链的 libxdo——enigo 截图核心需要）。注：DioxusLabs/dioxus-ci 官方
# actions 仓库只有 web 构建链，无 desktop 依赖清单，勿引用。
#
# 环境两个硬前提（详见 release.yml 头注释）：
# 1. rumi-ui 是 wry/WebKitGTK 桌面应用，Linux 需 webkit2gtk 4.1 系统依赖；
# 2. ort-sys 走 pkg-config 动态链系统 onnxruntime（防双 protobuf 互劫持，
#    见 server/Cargo.toml ort-sys 注释）——探测失败会静默回退静态预编译
#    并重新引入第二份 protobuf，所以构建前显式断言 pkg-config 能找到。

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  ORT_VERSION: "1.22.0"

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install desktop system deps (webkit2gtk 4.1 etc.)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libasound2-dev \
            libudev-dev \
            libayatana-appindicator3-dev \
            libglib2.0-dev \
            libxdo-dev

      # onnxruntime 不在 Ubuntu 官方源里：下载微软官方预编译包 +
      # 手写 .pc，让 ort-sys 的 pkg-config 探测命中动态库。
      - name: Prepare onnxruntime (pkg-config, dynamic link)
        run: |
          set -euxo pipefail
          curl -sSL -o /tmp/ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          sudo mkdir -p /opt/onnxruntime
          sudo tar -xzf /tmp/ort.tgz -C /opt/onnxruntime --strip-components=1
          sudo mkdir -p /opt/onnxruntime/lib/pkgconfig
          sudo tee /opt/onnxruntime/lib/pkgconfig/onnxruntime.pc >/dev/null <<EOF
          prefix=/opt/onnxruntime
          libdir=\${prefix}/lib
          includedir=\${prefix}/include

          Name: onnxruntime
          Description: ONNX Runtime (dynamic link)
          Version: ${ORT_VERSION}
          Libs: -L\${libdir} -lonnxruntime
          Cflags: -I\${includedir}
          EOF
          echo "PKG_CONFIG_PATH=/opt/onnxruntime/lib/pkgconfig" >> "$GITHUB_ENV"
          # 运行期：测试进程加载 libonnxruntime.so（链接期走 .pc，加载期
          # loader 不认 pkg-config），/opt 非默认搜索路径必须显式给。
          echo "LD_LIBRARY_PATH=/opt/onnxruntime/lib" >> "$GITHUB_ENV"

      # 断言：探测不到直接红，不给 ort-sys 静默回退静态库的机会。
      - name: Verify onnxruntime discoverable via pkg-config
        run: pkg-config --modversion onnxruntime

      # protobuf link_guard（translate/tests/link_guard.rs）扫的是
      # target/debug 下的 rumi-ui / rumi-server，先构建这两个 bin。
      - name: Build bins (link_guard coverage)
        run: cargo build -p rumi-ui -p rumi-server

      - name: Test (workspace)
        run: cargo test --workspace
