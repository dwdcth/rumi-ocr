# 预编译第三方 C++ 依赖 → 统一 deps release（CT2RS_PREBUILT_DIR 消费）。
# 手动触发，仅 ct2rs/CTranslate2/oneDNN 版本变化时跑；两个开关支持只跑
# 一部分（例：只补龙芯 → -f skip_matrix=true）。
#   - build（5 主流平台矩阵）：cargo 触发 ct2rs 完整 CMake，捞三静态库
#   - prebuilt-loong64：QEMU 容器纯 cmake 编 CTranslate2（无 dnnl）
name: prebuilt-deps

concurrency:
  # 同一 workflow+分支的新 run 自动取消旧 run（避免重复排队浪费）
  group: prebuilt-deps-${ github.ref }
  cancel-in-progress: true


on:
  workflow_dispatch:
    inputs:
      targets:
        description: '要跑的主流平台（JSON 数组；默认全部。例：只补 x64 两平台 ["x86_64-unknown-linux-gnu","x86_64-pc-windows-msvc"]）'
        required: false
        default: '["x86_64-unknown-linux-gnu","aarch64-unknown-linux-gnu","x86_64-pc-windows-msvc","x86_64-apple-darwin","aarch64-apple-darwin"]'
      skip_loong:
        description: 'true=跳过龙芯 job'
        required: false
        default: 'false'

permissions:
  contents: write
  packages: read

env:
  CARGO_TERM_COLOR: always
  ORT_VERSION: "1.22.1"

jobs:
  build:
    name: prebuilt (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(github.event.inputs.targets) }}
    # 平台属性查表（动态 matrix 无 include 字段）
    runs-on: ${{ fromJSON('{"x86_64-unknown-linux-gnu":"ubuntu-latest","aarch64-unknown-linux-gnu":"ubuntu-24.04-arm","x86_64-pc-windows-msvc":"windows-latest","x86_64-apple-darwin":"macos-15-intel","aarch64-apple-darwin":"macos-latest"}')[matrix.target] }}
    env:
      ORT_RID: ${{ fromJSON('{"x86_64-unknown-linux-gnu":"linux-x64","aarch64-unknown-linux-gnu":"linux-arm64","x86_64-pc-windows-msvc":"win-x64","x86_64-apple-darwin":"osx-x64","aarch64-apple-darwin":"osx-arm64"}')[matrix.target] }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install desktop system deps (linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libudev-dev \
            libayatana-appindicator3-dev libglib2.0-dev libxdo-dev \
            libpipewire-0.3-dev libspa-0.2-dev \
            libgbm-dev libdrm-dev libx11-dev libxcb1-dev libwayland-dev

      - name: Install libomp + ninja (macos only)
        if: runner.os == 'macOS'
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install libomp ninja
          brew link --force libomp

      # onnxruntime（NuGet）+ .pc：ort-sys 在依赖图里，探测失败会回退
      # 静态下载（污染产物语义），保持与 release.yml 相同的动态链环境。
      - name: Prepare onnxruntime (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          curl -sSL -o /tmp/ort.nupkg \
            "https://www.nuget.org/api/v2/package/Microsoft.ML.OnnxRuntime/${ORT_VERSION}"
          mkdir -p /tmp/ortx && cd /tmp/ortx
          unzip -q /tmp/ort.nupkg 'runtimes/*' 'build/native/include/*'
          sudo mkdir -p /opt/onnxruntime/lib /opt/onnxruntime/include
          sudo cp -r build/native/include/. /opt/onnxruntime/include/
          case "$ORT_RID" in
            linux-*)
              sudo cp "runtimes/$ORT_RID/native/libonnxruntime.so" /opt/onnxruntime/lib/
              sudo ln -sf libonnxruntime.so /opt/onnxruntime/lib/libonnxruntime.so.1
              ;;
            osx-*)
              sudo cp "runtimes/$ORT_RID/native/libonnxruntime.dylib" /opt/onnxruntime/lib/
              ;;
          esac
          sudo mkdir -p /opt/onnxruntime/lib/pkgconfig
          sudo tee /opt/onnxruntime/lib/pkgconfig/libonnxruntime.pc >/dev/null <<EOF
          prefix=/opt/onnxruntime
          libdir=\${prefix}/lib
          includedir=\${prefix}/include

          Name: onnxruntime
          Description: ONNX Runtime (dynamic link)
          Version: ${ORT_VERSION}
          Libs: -L\${libdir} -lonnxruntime
          Cflags: -I\${includedir}
          EOF
          echo "PKG_CONFIG_PATH=/opt/onnxruntime/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/opt/onnxruntime/lib" >> "$GITHUB_ENV"

      - name: Prepare onnxruntime + pkg-config (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install pkgconfiglite --no-progress -y
          $rid = $env:ORT_RID
          $url = "https://www.nuget.org/api/v2/package/Microsoft.ML.OnnxRuntime/$env:ORT_VERSION"
          Invoke-WebRequest -Uri $url -OutFile C:\ort.zip
          New-Item -ItemType Directory -Force C:\ort-raw | Out-Null
          tar -xf C:\ort.zip -C C:\ort-raw "runtimes/$rid/native" "build/native/include"
          New-Item -ItemType Directory -Force C:\onnxruntime\lib | Out-Null
          Copy-Item C:\ort-raw\build\native\include C:\onnxruntime\include -Recurse -Force
          Copy-Item "C:\ort-raw\runtimes\$rid\native\onnxruntime.dll" C:\onnxruntime\
          Copy-Item "C:\ort-raw\runtimes\$rid\native\onnxruntime.lib" C:\onnxruntime\lib\
          New-Item -ItemType Directory -Force C:\onnxruntime\lib\pkgconfig | Out-Null
          $pc = @(
            'prefix=C:/onnxruntime',
            'libdir=${prefix}/lib',
            '',
            'Name: onnxruntime',
            'Description: ONNX Runtime (dynamic link)',
            "Version: $env:ORT_VERSION",
            'Libs: -L${libdir} -lonnxruntime',
            'Cflags: -I${prefix}/include'
          ) -join "`n"
          Set-Content -Path C:\onnxruntime\lib\pkgconfig\libonnxruntime.pc -Value $pc
          "PKG_CONFIG_PATH=C:\onnxruntime\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify onnxruntime discoverable via pkg-config
        shell: bash
        run: pkg-config --modversion libonnxruntime

      # 完整 CMake 构建一次（产出三个静态库）
      - name: Build C++ deps via ct2rs
        shell: bash
        run: |
          # 条件 export（Windows 用 VS 生成器：msvc-dev-cmd 注入的 env 与
          # rustup 的 MSVC 探测冲突会踩坏 rustc 链接器）
          if [ "${{ runner.os }}" != "Windows" ]; then export CMAKE_GENERATOR=Ninja; fi
          cargo build --release -p rumi-translate --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-Ctarget-feature=+crt-static' || '' }}
          CXXFLAGS: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && '-march=x86-64' || '' }}
          OpenMP_ROOT: ${{ runner.os == 'macOS' && (runner.arch == 'ARM64' && '/opt/homebrew/opt/libomp' || '/usr/local/opt/libomp') || '' }}
          CPATH: ${{ runner.os == 'macOS' && (runner.arch == 'ARM64' && '/opt/homebrew/opt/libomp/include' || '/usr/local/opt/libomp/include') || '' }}
          LIBRARY_PATH: ${{ runner.os == 'macOS' && (runner.arch == 'ARM64' && '/opt/homebrew/lib' || '/usr/local/lib') || '' }}

      # 捞产物：ct2rs 的 libctranslate2.a、onednn-src 的 libdnnl.a、
      # （x86_64）cpu_features 的 libcpu_features.a —— 全 target 树兜底 find
      - name: Collect archives (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          CT2=$(find target -name 'libctranslate2.a' 2>/dev/null | head -1)
          DNNL=$(find target -name 'libdnnl.a' 2>/dev/null | head -1)
          test -n "$CT2" && test -n "$DNNL"
          DIR=$(dirname "$CT2")
          CF=$(find "$DIR" -name 'libcpu_features.a' 2>/dev/null | head -1 || true)
          STAGE=ct2-prebuilt-${{ matrix.target }}
          rm -rf /tmp/$STAGE && mkdir -p /tmp/$STAGE
          cp "$CT2" /tmp/$STAGE/
          cp "$DNNL" /tmp/$STAGE/
          [ -n "$CF" ] && cp "$CF" /tmp/$STAGE/ || true
          CT2RS_SHA=$(grep -A2 'name = "ct2rs"' Cargo.lock | grep source | grep -oE '#[0-9a-f]+' | tr -d '#')
          printf 'ct2rs=%s\ntarget=%s\ncmake=native(dnnl,openmp-comp%s)\n' \
            "$CT2RS_SHA" "${{ matrix.target }}" "${{ runner.os == 'Windows' && ',static-crt' || '' }}" > /tmp/$STAGE/BUILD_INFO
          tar czf ct2-prebuilt-${{ matrix.target }}.tar.gz -C /tmp $STAGE
          tar tzf ct2-prebuilt-${{ matrix.target }}.tar.gz

      - name: Diagnose Windows build artifacts
        if: runner.os == 'Windows' && always()
        shell: pwsh
        run: |
          $t = '${{ matrix.target }}'
          $buildDir = "target/$t/release/build"
          Write-Host "Inspecting: $buildDir (exists=$(Test-Path $buildDir))"
          Get-ChildItem $buildDir -Directory | Where-Object Name -Match 'ct2rs|onednn' | ForEach-Object {
            Write-Host "--- DIR: $($_.FullName) ---"
            Get-ChildItem $_.FullName -Directory | ForEach-Object {
              $inner = Join-Path $_.FullName "out"
              if (Test-Path $inner) {
                Write-Host "  [out 顶层]:"
                Get-ChildItem $inner | Select-Object -First 20 | ForEach-Object { Write-Host "    $($_.Name)" }
                $bdir = Join-Path $inner "build"
                if (Test-Path $bdir) {
                  Write-Host "  [out/build 顶层]:"
                  Get-ChildItem $bdir | Select-Object -First 20 | ForEach-Object { Write-Host "    $($_.Name)" }
                }
              }
              $outLog = Join-Path $_.FullName "output"
              if (Test-Path $outLog) {
                Write-Host "  [output head 60]:"
                Get-Content $outLog -TotalCount 60
                Write-Host "  [output tail 30]:"
                Get-Content $outLog -Tail 30
              }
            }
          }

      - name: Collect archives (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $t = '${{ matrix.target }}'
          # Windows 的 build script 目录是 build\ct2rs\<hash>（子目录形式，
          # 非 Unix 的 ct2rs-<hash>）——直接全树搜归档名，不猜目录布局
          $ct2 = Get-ChildItem "target/$t/release/build" -Recurse -Filter ctranslate2.lib | Select-Object -First 1
          $dnnl = Get-ChildItem "target/$t/release/build" -Recurse -Filter dnnl.lib | Select-Object -First 1
          if (-not $ct2 -or -not $dnnl) {
            Write-Host "=== 取证：target 下的 .lib ==="
            Get-ChildItem "target/$t/release/build" -Recurse -Include *.lib,*.a 2>$null | Select-Object -First 30 | ForEach-Object { $_.FullName }
            Write-Host "=== ct2rs/onednn build 目录 ==="
            Get-ChildItem "target/$t/release/build" -Directory | Where-Object Name -Match 'ct2rs|onednn' | ForEach-Object { $_.FullName }
            throw "archive not found: ct2=$ct2 dnnl=$dnnl"
          }
          # cpu_features：CTranslate2 在 x86_64 上硬依赖（GetX86Info 等），
          # 缺它则下游 LNK2019。同上全树搜，且必须存在。
          $cf = Get-ChildItem "target/$t/release/build" -Recurse -Filter cpu_features.lib | Select-Object -First 1
          if (-not $cf) { throw "cpu_features.lib not found under target/$t/release/build" }
          $stage = "ct2-prebuilt-$t"
          New-Item -ItemType Directory -Force "dist/$stage" | Out-Null
          Copy-Item $ct2.FullName "dist/$stage/"
          Copy-Item $dnnl.FullName "dist/$stage/"
          Copy-Item $cf.FullName "dist/$stage/"
          # 剥调试/符号段（MSVC .lib 归档可压 ~70-80%）：runner 预装 LLVM
          llvm-strip --strip-debug dist/$stage/*.lib
          $lock = Select-String -Path Cargo.lock -Pattern 'ct2rs' -Context 0,2 | Out-String
          $sha = if ($lock -match '#([0-9a-f]{7,40})') { $Matches[1] } else { 'unknown' }
          "ct2rs=$sha`ntarget=$t`ncmake=native(dnnl,openmp-comp,static-crt)" | Out-File "dist/$stage/BUILD_INFO"
          tar czf "ct2-prebuilt-$t.tar.gz" -C dist $stage
          tar tzf "ct2-prebuilt-$t.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: ct2-prebuilt-${{ matrix.target }}
          path: ct2-prebuilt-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # 龙芯预编译：QEMU 容器纯 cmake 编 CTranslate2（不经 cargo：loong 的
  # ct2rs 无 dnnl feature，直接 cmake 与 deps release 其他平台同构溯源）。
  prebuilt-loong64:
    if: github.event.inputs.skip_loong != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: loong64

      - name: Docker login ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build CT2 in QEMU container (loong64)
        run: |
          docker run -d --name rumi-loong-pre --platform linux/loong64 \
            ghcr.io/dwdcth/rumi-loong-build:v1 sleep infinity
          cat > /tmp/ct2-cmake.sh <<'EOS'
          set -euxo pipefail
          # 源钉 dwdcth/CTranslate2@slim-submodules（ct2rs fork gitlink 同点）
          git clone -q --depth 1 --branch slim-submodules \
            https://github.com/dwdcth/CTranslate2 /tmp/c3
          git -C /tmp/c3 fetch -q --depth 1 origin 90573db535c2b88ef2400a625de0249227e55090
          git -C /tmp/c3 checkout -q 90573db535c2b88ef2400a625de0249227e55090
          git -C /tmp/c3 submodule -q update --init --depth 1 third_party/cxxopts third_party/cpu_features third_party/spdlog
          mkdir -p /tmp/ct2build && cd /tmp/ct2build
          cmake /tmp/c3 -B . -DBUILD_CLI=OFF -DBUILD_SHARED_LIBS=OFF -DWITH_MKL=OFF \
            -DOPENMP_RUNTIME=COMP -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DENABLE_CPU_DISPATCH=OFF \
            -DCMAKE_BUILD_TYPE=Release '-DCMAKE_CXX_FLAGS= -ffunction-sections -fdata-sections -fPIC -w' \
            '-DCMAKE_C_FLAGS= -ffunction-sections -fdata-sections -fPIC -w'
          make -j"$(nproc)"
          test -f libctranslate2.a
          EOS
          docker cp /tmp/ct2-cmake.sh rumi-loong-pre:/tmp/ct2-cmake.sh
          docker exec rumi-loong-pre bash /tmp/ct2-cmake.sh
          mkdir -p dist/ct2-prebuilt-loongarch64-unknown-linux-gnu
          docker cp rumi-loong-pre:/tmp/ct2build/libctranslate2.a dist/ct2-prebuilt-loongarch64-unknown-linux-gnu/
          printf 'ct2rs=5007faae2b9f2d2147868be47a11e1be5da00f49\ntarget=loongarch64-unknown-linux-gnu\ncmake=native(openmp-comp,cpu-dispatch-off)\n' \
            > dist/ct2-prebuilt-loongarch64-unknown-linux-gnu/BUILD_INFO
          tar czf ct2-prebuilt-loongarch64-unknown-linux-gnu.tar.gz -C dist ct2-prebuilt-loongarch64-unknown-linux-gnu
          docker rm -f rumi-loong-pre

      - uses: actions/upload-artifact@v4
        with:
          name: ct2-prebuilt-loongarch64-unknown-linux-gnu
          path: ct2-prebuilt-loongarch64-unknown-linux-gnu.tar.gz
          if-no-files-found: error

  publish:
    needs: [build, prebuilt-loong64]
    if: >-
      !cancelled() &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.prebuilt-loong64.result == 'success' || needs.prebuilt-loong64.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to deps release
        run: |
          ls -la dist/
          # 统一 deps release（不存在则建；不匹配 v* 不触发正式发布 workflow）
          gh release view deps -R dwdcth/rumi-ocr >/dev/null 2>&1 || \
            gh release create deps -R dwdcth/rumi-ocr --title "预编译第三方依赖" \
              --notes "CTranslate2+oneDNN(+cpu_features) 静态库，按平台。CT2RS_PREBUILT_DIR 消费。仅依赖版本变化时重建。"
          gh release upload deps dist/*.tar.gz --clobber -R dwdcth/rumi-ocr
        env:
          GH_TOKEN: ${{ github.token }}
