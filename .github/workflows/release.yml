# rumi 多平台自动打包（tag v* 触发 / 手动 workflow_dispatch）。
# 结构参考 docforge 的 release.yml（7 目标 + SHA256SUMS + gh-release），
# 但目标组合按 rumi 的依赖现实做了替换：
#
# docforge 的 7 目标里有 3 个交叉编译（musl、aarch64-linux zigbuild、
# loongarch64 zigbuild），对 rumi 不可行——rumi-ui 是 wry/WebKitGTK 桌面
# 应用（需要目标平台的 webview 链接环境），translate 链 ct2rs 的 C++
# CTranslate2 也没有 musl/交叉预编译。因此 7 个产物全部用原生 runner：
#
#   1. x86_64-unknown-linux-gnu    ubuntu-latest
#   2. aarch64-unknown-linux-gnu   ubuntu-24.04-arm（公共仓库免费的 arm runner）
#   3. x86_64-pc-windows-msvc      windows-latest
#   4. x86_64-apple-darwin         macos-15-intel
#   5. aarch64-apple-darwin        macos-latest
#   6. loongarch64-unknown-linux-gnu QEMU 容器（ghcr.io/loong64/debian
#                                  新世界）；CTranslate2 的 C++ 是 QEMU 编译
#                                  大头（单轮 ~1h+），改用本仓库 loong64-deps
#                                  release 里的预编译 libctranslate2.a
#                                  （CT2RS_PREBUILT_DIR，ct2rs fork 支持）#                                  lipo 合并（不在单一 runner 上双 target 交叉
#                                  构建——ct2rs build.rs 用宿主架构宏定
#                                  CMAKE_OSX_ARCHITECTURES，交叉必错架构）
#
# onnxruntime 策略（全平台一致）：ort-sys 走 pkg-config 动态链（防双
# protobuf 互劫持，因果见 server/Cargo.toml ort-sys 注释）。源用 NuGet
# 官方包 Microsoft.ML.OnnxRuntime（主包内嵌全 RID 的 runtimes/<rid>/
# native/，本质是 zip）——微软官方 GitHub 仓库 2026-11-17 起整体 404，
# release 资产全灭，但 PyPI/NuGet 分发未受影响。Windows 加装
# pkgconfiglite 供 ort-sys 的 pkg-config 探测。
#
# 动态库随分发包走 + 各平台按链接器语义落位：
# - Windows：onnxruntime.dll 与 exe 同目录（加载器自动找）。
# - Linux：DT_NEEDED 是 SONAME libonnxruntime.so.1，包内 lib/ 放实体
#   libonnxruntime.so + 符号链接 .so.1，run-*.sh 设 LD_LIBRARY_PATH。
# - macOS：dylib 的 install_name 是 @rpath/libonnxruntime.<ver>.dylib，
#   DYLD_LIBRARY_PATH 对 @rpath 依赖无效——包内 lib/ 按 install_name
#   命名放 dylib，并用 install_name_tool 给每个 bin 加 LC_RPATH=
#   @executable_path/lib（add_rpath 改动二进制后 codesign ad-hoc 重签）。

name: release

concurrency:
  # 同一 workflow+分支的新 run 自动取消旧 run（避免重复排队浪费）
  group: release-${ github.ref }
  cancel-in-progress: true


on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version-suffix:
        description: '版本后缀（无 tag 触发时拼进包名，如 beta1）'
        required: false
        default: ''
      targets:
        description: "平台选择：all=全部 6 平台；或 JSON 数组只跑指定平台（5 主流用 target 名，龙芯用 loongarch64）。例：['x86_64-unknown-linux-gnu','loongarch64']"
        required: false
        default: 'all'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  ORT_VERSION: "1.22.1"
  # 发布档位：thin LTO + codegen units 8 + 剥符号（经 CARGO_PROFILE_*
  # 环境变量下发，不动 workspace Cargo.toml，本地构建行为不受影响）。
  # cgu=1 禁止单 crate 内多核并行 codegen，Intel 3-4 核 runner 上拖慢
  # 明显；ThinLTO 本身已跨 CGU 优化，1→8 的运行时差异在 1-3% 且算力
  # 大头在 C++ 引擎（ORT/CT2）侧，用户无感。
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '8'
  CARGO_PROFILE_RELEASE_STRIP: symbols


jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        # 'all' 展开全表；否则用 inputs.targets（JSON 数组）过滤指定平台
        target: ${{ fromJSON((inputs.targets != 'all' && inputs.targets) || (github.event.inputs.targets != 'all' && github.event.inputs.targets) || '["x86_64-unknown-linux-gnu","aarch64-unknown-linux-gnu","x86_64-pc-windows-msvc","x86_64-apple-darwin","aarch64-apple-darwin"]') }}
    # 平台属性查表（动态 matrix 无 include 字段）
    runs-on: ${{ fromJSON('{"x86_64-unknown-linux-gnu":"ubuntu-latest","aarch64-unknown-linux-gnu":"ubuntu-24.04-arm","x86_64-pc-windows-msvc":"windows-latest","x86_64-apple-darwin":"macos-15-intel","aarch64-apple-darwin":"macos-latest"}')[matrix.target] }}
    env:
      ORT_RID: ${{ fromJSON('{"x86_64-unknown-linux-gnu":"linux-x64","aarch64-unknown-linux-gnu":"linux-arm64","x86_64-pc-windows-msvc":"win-x64","x86_64-apple-darwin":"osx-x64","aarch64-apple-darwin":"osx-arm64"}')[matrix.target] }}
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # envVars 把 ORT_VERSION 纳入缓存键：target/ 里有 ct2rs 的 CMake
      # 产物（CMakeCache/libctranslate2.a），ORT 换版本而 lock 未变时
      # 防止复用脏缓存。
      - uses: Swatinem/rust-cache@v2
        with:
          # v2 前缀：启用 ccache/Ninja 前的 CMakeCache 无 COMPILER_LAUNCHER
          # 记录，存量恢复后 env 不会覆盖已存在的 cache，强制换前缀清一次
          prefix: release-v2-${{ matrix.target }}
          envVars: ORT_VERSION
          cache-on-failure: true

      - name: Install desktop system deps (linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libasound2-dev \
            libudev-dev \
            libayatana-appindicator3-dev \
            libglib2.0-dev \
            libxdo-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            ninja-build \
            lld \
            libgbm-dev \
            libdrm-dev \
            libx11-dev \
            libxcb1-dev \
            libwayland-dev

      # C++ 层 ccache（Linux/macOS）：rust-cache 的 key 含 Cargo.lock，
      # 依赖一变 target/ 全废（macOS Intel 冷编 C++ 就是 39min 的大头）；
      # ccache 按编译单元内容寻址，Cargo.lock 变化仍可命中（ct2rs/
      # onednn-src 未升时接近 100%）。Windows 不上：MSBuild 生成器 + /Zi
      # PCH 等坑，且其 13.5min 可接受。
      - uses: hendrikmuhs/ccache-action@v1
        if: runner.os != 'Windows'
        with:
          key: ccache-${{ matrix.target }}
          max-size: 1G

      # ---- onnxruntime 准备（NuGet 统一源，按平台分支落位）----
      # unix：nuget 主包（zip）解出 runtimes/<rid>/native/ → /opt 布局 +
      # 手写 .pc（探测名 libonnxruntime——ort-sys probe 的名字）。
      # 来源改 NuGet 的原因：微软官方 GitHub 仓库 2026-11-17 起整体 404，
      # GH release 资产全灭；PyPI/NuGet 分发未受影响。
      - name: Prepare onnxruntime (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          curl -sSL -o /tmp/ort.nupkg \
            "https://www.nuget.org/api/v2/package/Microsoft.ML.OnnxRuntime/${ORT_VERSION}"
          mkdir -p /tmp/ortx && cd /tmp/ortx
          unzip -q /tmp/ort.nupkg 'runtimes/*' 'build/native/include/*'
          sudo mkdir -p /opt/onnxruntime/lib /opt/onnxruntime/include
          sudo cp -r build/native/include/. /opt/onnxruntime/include/
          case "$ORT_RID" in
            linux-*)
              sudo cp "runtimes/$ORT_RID/native/libonnxruntime.so" /opt/onnxruntime/lib/
              # SONAME=libonnxruntime.so.1：运行期 loader 按此名解析
              sudo ln -sf libonnxruntime.so /opt/onnxruntime/lib/libonnxruntime.so.1
              ;;
            osx-*)
              sudo cp "runtimes/$ORT_RID/native/libonnxruntime.dylib" /opt/onnxruntime/lib/
              ;;
          esac
          sudo mkdir -p /opt/onnxruntime/lib/pkgconfig
          sudo tee /opt/onnxruntime/lib/pkgconfig/libonnxruntime.pc >/dev/null <<EOF
          prefix=/opt/onnxruntime
          libdir=\${prefix}/lib
          includedir=\${prefix}/include

          Name: onnxruntime
          Description: ONNX Runtime (dynamic link)
          Version: ${ORT_VERSION}
          Libs: -L\${libdir} -lonnxruntime
          Cflags: -I\${includedir}
          EOF
          echo "PKG_CONFIG_PATH=/opt/onnxruntime/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      # Windows：同一 nuget 主包，tar (bsdtar) 按 RID 选择性解压（比
      # Expand-Archive 全量解 500MB 快得多）+ pkgconfiglite 提供探测。
      - name: Prepare onnxruntime + pkg-config (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install pkgconfiglite --no-progress -y
          $rid = $env:ORT_RID
          $url = "https://www.nuget.org/api/v2/package/Microsoft.ML.OnnxRuntime/$env:ORT_VERSION"
          Invoke-WebRequest -Uri $url -OutFile C:\ort.zip
          New-Item -ItemType Directory -Force C:\ort-raw | Out-Null
          tar -xf C:\ort.zip -C C:\ort-raw "runtimes/$rid/native" "build/native/include"
          New-Item -ItemType Directory -Force C:\onnxruntime\lib | Out-Null
          Copy-Item C:\ort-raw\build\native\include C:\onnxruntime\include -Recurse -Force
          Copy-Item "C:\ort-raw\runtimes\$rid\native\onnxruntime.dll" C:\onnxruntime\
          Copy-Item "C:\ort-raw\runtimes\$rid\native\onnxruntime.lib" C:\onnxruntime\lib\
          New-Item -ItemType Directory -Force C:\onnxruntime\lib\pkgconfig | Out-Null
          $pc = @(
            'prefix=C:/onnxruntime'
            'libdir=${prefix}/lib'
            ''
            'Name: onnxruntime'
            'Description: ONNX Runtime (dynamic link)'
            "Version: $env:ORT_VERSION"
            'Libs: -L${libdir} -lonnxruntime'
            'Cflags: -I${prefix}/include'
          ) -join "`n"
          Set-Content -Path C:\onnxruntime\lib\pkgconfig\libonnxruntime.pc -Value $pc
          "PKG_CONFIG_PATH=C:\onnxruntime\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # 断言：探测不到直接红，不给 ort-sys 静默回退静态库
      # （回退会重新引入第二份 protobuf，运行期 SIGSEGV）的机会。
      - name: Verify onnxruntime discoverable via pkg-config
        shell: bash
        run: pkg-config --modversion libonnxruntime

      # AppleClang 不带 OpenMP（CTranslate2 OPENMP_RUNTIME=COMP 需要），
      # 装 brew libomp 并用 OpenMP_ROOT 让 CMake 的 FindOpenMP 命中。
      - name: Install libomp + ninja (macos only)
        if: runner.os == 'macOS'
        # link --force：libomp 是 keg-only，force 后 omp.h/libomp.dylib 进
        # /opt/homebrew/{include,lib}（FindOpenMP 默认搜索路径）。不能只靠
        # OpenMP_ROOT——CTranslate2 的 cmake_minimum_required(3.5) 使
        # CMP0074 未启用，CMake 会显式忽略 <PackageName>_ROOT 环境变量。
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install libomp ninja
          brew link --force libomp

      # ---- C++ 预编译依赖（deps release）→ CT2RS_PREBUILT_DIR 直链 ----
      # CT2+oneDNN(+cpu_features) 归档由 prebuilt-deps workflow 产出（仅
      # 依赖版本变化时重建），正式发布 C++ 零编译。
      - name: Download prebuilt C++ deps
        shell: bash
        run: |
          set -euxo pipefail
          curl -sSL -o /tmp/ct2.tgz \
            "https://github.com/dwdcth/rumi-ocr/releases/download/deps/ct2-prebuilt-${{ matrix.target }}.tar.gz"
          sudo mkdir -p /opt/ct2-prebuilt
          sudo tar -xzf /tmp/ct2.tgz --strip-components=1 -C /opt/ct2-prebuilt
          ls -la /opt/ct2-prebuilt/
          test -f /opt/ct2-prebuilt/libctranslate2.a || test -f /opt/ct2-prebuilt/ctranslate2.lib

      # ---- 构建 ----
      # CXXFLAGS 只在 x86_64 Linux 钉基线（原因见 ci.yml 同名注释：
      # CTranslate2 基础 kernels.cc 的 ISA 泄漏防御）。
      - name: Build
        shell: bash
        run: |
          # Ninja 仅 Unix（Windows 的 MSBuild 生成器保持默认）。条件 export：
          # env 里条件表达式在 Windows 会产出空串变量，cmake-rs 转成 -G ""
          # 直接 'Could not create named generator'。
          if [ "${{ runner.os }}" != "Windows" ]; then export CMAKE_GENERATOR=Ninja; fi
          export CT2RS_PREBUILT_DIR=/opt/ct2-prebuilt
          # ct2-prebuilt：链预编译归档（translate 的 feature；no-default 关掉
          # 源码编译的 ct2-dnnl——两者不能同开，onednn-src 会击穿跳过）
          cargo build --release --workspace --target ${{ matrix.target }} \
            --no-default-features --features rumi-translate/ct2-prebuilt
        env:
          CXXFLAGS: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && '-march=x86-64' || '' }}
          OpenMP_ROOT: ${{ runner.os == 'macOS' && (runner.arch == 'ARM64' && '/opt/homebrew/opt/libomp' || '/usr/local/opt/libomp') || '' }}
          # oneDNN 的 OpenMP.cmake 只 append flags 不加 FindOpenMP 的
          # include 目录（上游对 AppleClang+brew libomp 的兼容缺口），
          # omp.h 找不到——CPATH 让 clang 直接搜到。
          CPATH: ${{ runner.os == 'macOS' && (runner.arch == 'ARM64' && '/opt/homebrew/opt/libomp/include' || '/usr/local/opt/libomp/include') || '' }}
          # LIBRARY_PATH：clang 的 -L 补充（同 CPATH 之于 -I）。ct2rs 对
          # macOS 链 -lomp（brew libomp），但 /opt/homebrew/lib 不在 rustc
          # 传给链接器的默认搜索路径，缺此变量则 ld: library 'omp' not found。
          LIBRARY_PATH: ${{ runner.os == 'macOS' && (runner.arch == 'ARM64' && '/opt/homebrew/lib' || '/usr/local/lib') || '' }}
          # Windows：ct2rs 给 CTranslate2 传 static_crt(true)（/MT），Rust 侧
          # 必须同样 crt-static，否则 LNK2038 MT/MD 不匹配（静态 CRT 也免去
          # 用户装 VC++ redist）。onnxruntime.dll 是 /MD 自带 CRT，C API 纯 C
          # 跨边界不传 CRT 对象，混合合法。
          # RUSTFLAGS（按平台三态；env 会覆盖 .cargo/config.toml 的
          # rustflags，故 Linux 的 exclude-libs 一并显式携带，等价替换）：
          # - Windows：crt-static（ct2rs 强制 /MT）
          # - Linux：exclude-libs + lld 链接（GNU ld 单线程，ThinLTO +
          #   大 C++ 静态库的链接期数十秒→数秒）
          # - macOS：留空（沿用 config.toml；其 linux 段本就不适用）
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-Ctarget-feature=+crt-static' || (runner.os == 'Linux' && '-Clink-arg=-Wl,--exclude-libs,ALL -Clink-arg=-fuse-ld=lld' || '') }}
          CMAKE_C_COMPILER_LAUNCHER: ${{ runner.os != 'Windows' && 'ccache' || '' }}
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ runner.os != 'Windows' && 'ccache' || '' }}
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: 'true'
          CCACHE_COMPILERCHECK: content

      - name: Diagnose ct2rs cmake flags (on failure)
        if: failure()
        shell: bash
        run: |
          set -x
          find target -path '*ct2rs*/out/build/CMakeCache.txt' \
            -exec grep -H "CMAKE_CXX_FLAGS" {} \; | head -20
          find target -path '*ct2rs*/out*' -name 'libctranslate2.a' | head -1 \
            | xargs -r nm -C 2>/dev/null \
            | grep "reduce_amax<(ctranslate2::cpu::CpuIsa)" \
            | grep -oE "CpuIsa\)[0-9]+, float" | sort | uniq -c

      # ---- 包名（tag 名 / short sha + 可选后缀）----
      # 注意：LABEL 不带 rumi- 前缀（打包步会拼 rumi-${LABEL}-<target>）。
      - name: Determine release label
        shell: bash
        run: |
          set -euxo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            label="${GITHUB_REF#refs/tags/}"
          else
            label="$(echo "$GITHUB_SHA" | cut -c1-7)"
            suffix="${{ inputs.version-suffix }}"
            if [ -n "$suffix" ]; then label="$label-$suffix"; fi
          fi
          echo "LABEL=$label" >> "$GITHUB_ENV"

      # ---- 打包（unix：tar.gz，bin + README + ort 动态库 + wrapper）----
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          target="${{ matrix.target }}"
          stage="rumi-${LABEL}-${target}"
          mkdir -p "$stage/lib"
          for b in rumi-ui rumi-server rumi-capture rumi-translate-cli; do
            cp "target/${target}/release/$b" "$stage/"
          done
          cp README.md "$stage/" 2>/dev/null || true
          # ort 动态库落位（平台各自的链接器语义，见文件头注释）
          case "$ORT_RID" in
            linux-*)
              # 实体 .so + SONAME 符号链接 .so.1（cp -P 保留链接，tar 同样保留）
              cp -P /opt/onnxruntime/lib/libonnxruntime.so /opt/onnxruntime/lib/libonnxruntime.so.1 "$stage/lib/"
              ;;
            osx-*)
              cp /opt/onnxruntime/lib/libonnxruntime.dylib \
                "$stage/lib/libonnxruntime.${ORT_VERSION}.dylib"
              ;;
          esac
          # macOS：依赖记的是 @rpath/libonnxruntime.<ver>.dylib，给每个 bin
          # 加 LC_RPATH=@executable_path/lib 指包内；add_rpath 动过二进制，
          # ad-hoc 重签（arm64 无签名直接拒绝加载）。dylib 一并重签——
          # nuget 解出的原 dylib 无有效签名，arm64 加载同样会被拒。
          if [[ "$ORT_RID" == osx-* ]]; then
            for b in rumi-ui rumi-server rumi-capture rumi-translate-cli; do
              install_name_tool -add_rpath @executable_path/lib "$stage/$b"
              codesign --force --sign - "$stage/$b"
            done
            codesign --force --sign - "$stage/lib/libonnxruntime.${ORT_VERSION}.dylib"
          fi
          # run-*.sh：Linux 设 LD_LIBRARY_PATH（SONAME 解析，尾部追加式防
          # 空段引入 CWD 搜索）；macOS 已有 rpath，wrapper 只为统一入口
          for b in rumi-ui rumi-server rumi-capture rumi-translate-cli; do
            {
              echo '#!/bin/sh'
              echo 'DIR=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)'
              if [[ "$ORT_RID" == linux-* ]]; then
                echo 'export LD_LIBRARY_PATH="$DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"'
              fi
              echo "exec \"\$DIR/$b\" \"\$@\""
            } > "$stage/run-$b.sh"
            chmod +x "$stage/run-$b.sh"
          done
          tar czf "rumi-${LABEL}-${target}.tar.gz" "$stage"

      # ---- 打包（windows：zip，exe + README + onnxruntime.dll 同目录）----
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = '${{ matrix.target }}'
          $stage = "rumi-$env:LABEL-$target"
          New-Item -ItemType Directory -Force $stage | Out-Null
          foreach ($b in 'rumi-ui','rumi-server','rumi-capture','rumi-translate-cli') {
            Copy-Item "target/$target/release/$b.exe" $stage
          }
          if (Test-Path README.md) { Copy-Item README.md $stage }
          Copy-Item C:\onnxruntime\onnxruntime.dll $stage
          Compress-Archive -Path $stage -DestinationPath "rumi-$env:LABEL-$target.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: rumi-${{ env.LABEL }}-${{ matrix.target }}
          path: |
            rumi-${{ env.LABEL }}-${{ matrix.target }}.tar.gz
            rumi-${{ env.LABEL }}-${{ matrix.target }}.zip
          if-no-files-found: error

  # 龙芯（loongarch64，新世界）：QEMU 容器 + 预装镜像 + deps release 的
  # 预编译 CT2。独立 job（流程与主流平台不同：无 ort 步骤/无 rust-toolchain，
  # 全在容器内）。targets 含 loongarch64 或 all 时跑；tag 触发恒跑。
  build-loong64:
    name: build (loongarch64-unknown-linux-gnu)
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.targets == 'all' ||
      contains(github.event.inputs.targets, 'loongarch64')
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
      packages: read
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Determine release label
        shell: bash
        run: |
          set -euxo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            label="${GITHUB_REF#refs/tags/}"
          else
            label="$(echo "$GITHUB_SHA" | cut -c1-7)"
            suffix="${{ inputs.version-suffix }}"
            if [ -n "$suffix" ]; then label="$label-$suffix"; fi
          fi
          echo "LABEL=$label" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: loong64

      # cargo 缓存挂载点（宿主目录，actions/cache 持久化；容器路径恒定
      # /build/target 保证 build script fingerprint 跨轮有效）
      - name: Restore cargo caches
        uses: actions/cache@v4
        with:
          path: |
            /tmp/loong-target
            /tmp/loong-cargo-registry
            /tmp/loong-cargo-git
          key: loong-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: loong-cargo-

      # 脚本经 heredoc 落盘再 docker exec，避免多层引号转义。
      - name: Docker login ghcr (pull private image)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build in QEMU loong64 container
        run: |
          cat > /tmp/loong-build.sh <<'EOS'
          set -euxo pipefail
          # commit 镜像不带 ENV（docker commit 不保留环境变量），ORT 探测
          # 与加载路径显式给出（缺 PKG_CONFIG_PATH 时 ort-sys 回退下载
          # 预编译包，loongarch64 无资产直接挂）
          export PKG_CONFIG_PATH=/opt/onnxruntime/lib/pkgconfig
          export LD_LIBRARY_PATH=/opt/onnxruntime/lib
          pkg-config --modversion libonnxruntime
          # CTranslate2 预编译静态库（loong64-deps release）
          mkdir -p /opt/ct2-prebuilt
          curl -sSL -o /tmp/ct2.tgz \
            "https://github.com/dwdcth/rumi-ocr/releases/download/deps/ct2-prebuilt-loongarch64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/ct2.tgz -C /opt/ct2-prebuilt
          test -f /opt/ct2-prebuilt/libctranslate2.a

          . ~/.cargo/env
          cp -r /src/. /build/
          cd /build
          export CT2RS_PREBUILT_DIR=/opt/ct2-prebuilt
          cargo build --release --workspace --target loongarch64-unknown-linux-gnu

          # 打包（与 Linux 原生 job 同构：bins + ort so + run-*.sh）
          target=loongarch64-unknown-linux-gnu
          stage="rumi-${LABEL}-${target}"
          mkdir -p "/out/${stage}/lib"
          for b in rumi-ui rumi-server rumi-capture rumi-translate-cli; do
            cp "target/${target}/release/$b" "/out/${stage}/"
            printf '#!/bin/sh\nDIR=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)\nexport LD_LIBRARY_PATH="$DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"\nexec "$DIR/%s" "$@"\n' "$b" > "/out/${stage}/run-$b.sh"
            chmod +x "/out/${stage}/run-$b.sh"
          done
          cp -P /opt/onnxruntime/lib/libonnxruntime.so /opt/onnxruntime/lib/libonnxruntime.so.1 "/out/${stage}/lib/"
          cp README.md "/out/${stage}/" 2>/dev/null || true
          tar czf "/out/rumi-${LABEL}-${target}.tar.gz" -C /out "$stage"
          ls -la /out
          EOS

          mkdir -p /tmp/loong-target /tmp/loong-cargo-registry /tmp/loong-cargo-git
          docker run -d --name rumi-loong --platform linux/loong64 \
            -v "$GITHUB_WORKSPACE":/src:ro \
            -v /tmp/loong-target:/build/target \
            -v /tmp/loong-cargo-registry:/root/.cargo/registry \
            -v /tmp/loong-cargo-git:/root/.cargo/git \
            ghcr.io/dwdcth/rumi-loong-build:v1 sleep infinity
          docker cp /tmp/loong-build.sh rumi-loong:/tmp/loong-build.sh
          docker exec -e LABEL="$LABEL" rumi-loong bash /tmp/loong-build.sh
          mkdir -p dist
          docker cp rumi-loong:/out/. dist/

      - uses: actions/upload-artifact@v4
        with:
          name: rumi-${{ env.LABEL }}-loongarch64-unknown-linux-gnu
          path: dist/rumi-${{ env.LABEL }}-loongarch64-unknown-linux-gnu.tar.gz
          if-no-files-found: error

      # tag 发布：资产与其他 5 平台并进同一个 GitHub Release（独立
      # workflow 并行跑不拖慢主线；softprops 自动挂到同名 tag release）
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/rumi-${{ env.LABEL }}-loongarch64-unknown-linux-gnu.tar.gz



  release:
    needs: [build, build-loong64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS.txt
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
