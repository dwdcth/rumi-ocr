[package]
name = "rumi-server"
version = "0.1.0"
edition = "2024"
description = "Rumi HTTP API（Umi 兼容子集）：axum 0.8，127.0.0.1:1224，热加载引擎选择（native / plugin:xxx）"

[lib]
name = "rumi_server"
path = "src/lib.rs"

[[bin]]
name = "rumi-server"
path = "src/bin/rumi_server.rs"

[dependencies]
# M3 §5：Umi 兼容 HTTP API（默认 features 已含 json/query/tokio/http1）
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ~/.config/rumi/config.toml 解析
toml = "0.8"
# {"base64": ...} 请求体解码
base64 = "0.22"
# native 引擎（OcrEngine / load_frame / scan_qr）
rumi-ocr = { path = "../ocr" }
# plugin:<名> 引擎（BlockingPluginProcess 走 Umi 插件协议）
plugins-worker = { path = "../plugins-worker" }

[dependencies.tokio]
version = "1"
features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"]

[dev-dependencies]
# 测试里生成空白 PNG（离线，不发网络请求）
image = { version = "0.25", default-features = false, features = ["png"] }
# tests/http_tests.rs 合成识别图：白底黑字（与 ocr crate 的测试同款思路）
imageproc = "0.27"
ab_glyph = "0.2"
