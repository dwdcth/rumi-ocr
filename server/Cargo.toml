[package]
name = "rumi-server"
version = "0.1.0"
edition = "2024"
description = "Rumi HTTP API（Umi 兼容子集）：axum 0.8，127.0.0.1:1224，热加载引擎选择（native / plugin:xxx）"

[lib]
name = "rumi_server"
path = "src/lib.rs"

[[bin]]
name = "rumi-server"
path = "src/bin/rumi_server.rs"

[dependencies]
# M3 §5：Umi 兼容 HTTP API（默认 features 已含 json/query/tokio/http1）
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ~/.config/rumi/config.toml 解析
toml = "0.8"
# {"base64": ...} 请求体解码
base64 = "0.22"
# native 引擎（OcrEngine / load_frame / scan_qr）
rumi-ocr = { path = "../ocr" }
# plugin:<名> 引擎（BlockingPluginProcess 走 Umi 插件协议）
plugins-worker = { path = "../plugins-worker" }
# /api/translate*（离线 CT2 + 在线 providers + 模型下载）
rumi-translate = { path = "../translate" }
# 仅为本 crate 的依赖图启用 ort-sys 的 pkg-config 策略（特性统一作用于本图内
# 的 rumi-ocr → oar-ocr → ort → ort-sys）：系统 libonnxruntime（动态）优先于
# 预编译静态库。为什么必须：静态 ort-sys 内嵌 protobuf 3.14，而 rumi-translate
# → ct2rs → sentencepiece-sys 静态内嵌 protobuf-lite 3.21——两份 protobuf 同链
# 时符号互相污染，运行到模型加载必 FATAL（互相报 "compiled against version X,
# installed version Y"），非链接器开关可救。系统动态 ORT 后，可执行文件里只剩
# ct2 一份静态 protobuf，两者各自完整。探测失败（无 libonnxruntime.pc）会回退
# 静态下载，行为同旧。系统依赖：pacman -S onnxruntime（≥1.17 即可）。
ort-sys = { version = "=2.0.0-rc.13", features = ["pkg-config"] }

[dependencies.tokio]
version = "1"
features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"]

[dev-dependencies]
# 测试里生成空白 PNG（离线，不发网络请求）
image = { version = "0.25", default-features = false, features = ["png"] }
# tests/http_tests.rs 合成识别图：白底黑字（与 ocr crate 的测试同款思路）
imageproc = "0.27"
ab_glyph = "0.2"
