[package]
name = "rumi-translate"
version = "0.1.0"
edition = "2024"
license = "MulanPSL-2.0"

# 链接加固：--exclude-libs,ALL 经 build.rs 下发（防 RUSTFLAGS 环境变量静默
# 覆盖 config.toml 的 rustflags，见 build.rs 注释）
build = "build.rs"

[lib]
name = "rumi_translate"
path = "src/lib.rs"

[[bin]]
name = "rumi-translate-cli"
path = "src/bin/rumi_translate_cli.rs"

[features]
# 过渡开关：启用则回退 ct2rs 自带 C++ sentencepiece（含 protobuf-lite，会重新引入
# 双 protobuf 风险，仅排查分词问题时用）；默认纯 Rust 路线。稳定 1-2 个版本后删除。
spm-sys = ["ct2rs/sentencepiece"]
# ct2rs 的 oneDNN 后端两条互斥路线（不能同开：dnnl 拉 onednn-src 无条件
# 编译 oneDNN，会击穿预编译的跳过）：
# - ct2-dnnl（default）：源码编译（本地开发/CI bootstrap 出预编译用）
# - ct2-prebuilt：链 deps release 的预编译归档（CT2RS_PREBUILT_DIR，
#   CI 正式发布用，C++ 零编译）。构建命令：
#   cargo build --no-default-features --features rumi-translate/ct2-prebuilt
default = ["ct2-dnnl"]
ct2-dnnl = ["ct2rs/dnnl"]
ct2-prebuilt = ["ct2rs/dnnl-prebuilt"]

[dependencies]
# 分词：纯 Rust 直载 .spm（对拍 744/744 全等，见 docs/spm-parity-report.md）。
# 锁死精确版本：上游为 2026-05 新 crate（单人维护），升级必须重跑
# tests/spm_parity_tests.rs golden 回归；上游烂尾则 fork（用户已拍板自维护）。
sentencepiece-rs = "=0.2.2"
# ct2rs Tokenizer trait 签名用 anyhow::Result，实现该 trait 必须直接依赖
# （ct2rs 不再导出；semver 同为 1.x，编译期解析到同一 crate）
anyhow = "1"
# HTTP（在线翻译 + 模型下载）。tls=rustls 不引 openssl；Proxy::try_from_system 尊重代理环境变量
ureq = { version = "2", default-features = false, features = ["tls", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
# Argos .argosmodel（zip）导入解包
zip = { version = "2", default-features = false, features = ["deflate"] }
# 文档翻译（v1：解析→翻译单元→逐单元翻译→双语 Markdown 回写）。
# 与 ocr crate 同一 git 源同 tag（v0.1.1，crates.io 尚未 publish），
# cargo 统一 checkout。default = 文本族 (md/csv/html/rtf，纯 Rust 轻依赖，
# txt 恒有)——不开 default 会让单包构建（-p rumi-translate 的 CLI）翻不了
# 这些格式；encoding=中文编码链，lang-detect=源语言检测
# （TranslationUnit.lang，v2 自动检测用），docx/epub/pdf=主流文档格式。
docforge = { git = "https://github.com/dwdcth/docforge", tag = "v0.1.1", features = ["encoding", "lang-detect", "docx", "epub", "pdf", "fb2", "odt"] }
# 双语对照 PDF 出口（bilingual_pdf）：与 ocr crate 同版本同源。字体嵌入
# 经验（TTC 剥离重建 sfnt + Type0）从 ocr/dual_pdf.rs 复制进本 crate，
# 刻意不加 translate→ocr 依赖保持轻依赖
oxidize-pdf = "5"

# ct2rs 推理引擎按目标架构分两处声明（互斥 cfg，同平台只激活一条，无
# feature 并集问题）。源用 dwdcth fork 的 loongarch64 分支（基于上游
# v0.9.22 + 一处 loongarch 补丁，见下）——同 crate 不能 crates.io/git
# 双源混用，故全平台统一走 fork 分支；上游合并补丁后可切回 crates.io：
# - 主流平台：oneDNN 后端（vendored oneDNN，Intel/AMD Zen 优化）+ GNU
#   OpenMP 运行时；关闭默认 ruy（int8 GEMM 需要 oneDNN）。
# - loongarch64：两处硬障碍——oneDNN 上游无 LoongArch CPU 后端（x64
#   源文件喂 loongarch gcc 直接编挂），CTranslate2 的 CPU_ISA_DISPATCH
#   宏只覆盖 x86/arm（fork 补丁在 loongarch64 关 ENABLE_CPU_DISPATCH
#   走 GENERIC 单 ISA 回退）。故去 dnnl，CT2 回退内建 GEMM（能跑但慢），
#   等社区 oneDNN 移植后再放开。
[target.'cfg(not(target_arch = "loongarch64"))'.dependencies]
ct2rs = { git = "https://github.com/dwdcth/ctranslate2-rs", branch = "loongarch64", default-features = false, features = ["openmp-runtime-comp"] }

[target.'cfg(target_arch = "loongarch64")'.dependencies]
ct2rs = { git = "https://github.com/dwdcth/ctranslate2-rs", branch = "loongarch64", default-features = false, features = ["openmp-runtime-comp"] }

[dev-dependencies]
tempfile = "3"
