<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background rounded square -->
  <rect width="256" height="256" rx="52" fill="#1a1a2e"/>

  <!-- Document body -->
  <rect x="56" y="44" width="120" height="148" rx="10" fill="#16213e"/>
  <rect x="56" y="44" width="120" height="148" rx="10" fill="none" stroke="#4a9eff" stroke-width="3"/>

  <!-- Document lines (text representation) -->
  <rect x="72" y="74" width="88" height="7" rx="3.5" fill="#4a9eff" opacity="0.7"/>
  <rect x="72" y="92" width="72" height="7" rx="3.5" fill="#4a9eff" opacity="0.5"/>
  <rect x="72" y="110" width="80" height="7" rx="3.5" fill="#4a9eff" opacity="0.5"/>
  <rect x="72" y="128" width="60" height="7" rx="3.5" fill="#4a9eff" opacity="0.5"/>

  <!-- Selection box on document (OCR scan area) -->
  <rect x="68" y="68" width="100" height="80" rx="4" fill="none" stroke="#00d4ff" stroke-width="2" stroke-dasharray="6,3"/>

  <!-- Corner handles -->
  <rect x="65" y="65" width="10" height="10" rx="2" fill="#00d4ff"/>
  <rect x="161" y="65" width="10" height="10" rx="2" fill="#00d4ff"/>
  <rect x="65" y="141" width="10" height="10" rx="2" fill="#00d4ff"/>
  <rect x="161" y="141" width="10" height="10" rx="2" fill="#00d4ff"/>

  <!-- Magnifying glass -->
  <circle cx="174" cy="174" r="36" fill="#1a1a2e"/>
  <circle cx="174" cy="174" r="30" fill="none" stroke="#ff6b6b" stroke-width="8"/>
  <circle cx="174" cy="174" r="18" fill="none" stroke="#ff6b6b" stroke-width="4" opacity="0.4"/>
  <!-- Magnifying glass handle -->
  <line x1="196" y1="196" x2="216" y2="216" stroke="#ff6b6b" stroke-width="10" stroke-linecap="round"/>
</svg>
